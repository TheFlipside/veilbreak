# wifi-testlab — hidden AP configuration
# The 'interface' line is overridden by setup.sh at runtime.
interface=wlan0
driver=nl80211

ssid=VeilbreakLab
hw_mode=g
channel=6

# Hidden SSID: zeroes the ESSID field in beacon frames.
# Use 2 instead of 1 to send empty-string beacons (less common variant).
ignore_broadcast_ssid=1

# WPA2-PSK — realistic association for probe request/response testing.
wpa=2
wpa_passphrase=veilbreak-test-only
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
