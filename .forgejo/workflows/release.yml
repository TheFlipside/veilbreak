name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  release:
    runs-on: linux
    steps:
      - uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: https://github.com/dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: https://github.com/Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Validate tag format
        id: version
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match vN.N.N format"
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: cargo test --all --locked

      - name: Build release binary
        run: cargo build --release --locked -p veilbreak-tui

      - name: Package tarball
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p "dist" "staging/veilbreak-${TAG}"
          cp target/release/veilbreak-tui "staging/veilbreak-${TAG}/"
          cp README.md LICENSE "staging/veilbreak-${TAG}/"
          cp -r themes "staging/veilbreak-${TAG}/"
          tar czf "dist/veilbreak-${TAG}-x86_64-linux.tar.gz" \
            -C staging "veilbreak-${TAG}"

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 2.11.1 --locked

      - name: Build .deb package
        run: cargo deb -p veilbreak-tui --no-build --output dist/

      - name: Create Forgejo release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGEJO_URL: https://git.fiedler.live
        run: |
          printf '## Installation\n\n### Binary (any Linux)\n```bash\ntar xzf veilbreak-%s-x86_64-linux.tar.gz\nsudo cp veilbreak-%s/veilbreak-tui /usr/local/bin/\n```\n\n### Debian / Ubuntu\n```bash\nsudo dpkg -i veilbreak_*_amd64.deb\nsudo apt-get install -f\n```\n\n### From source\n```bash\ncargo install --git https://git.fiedler.live/tux/veilbreak.git veilbreak-tui\n```\n' "$TAG" "$TAG" > /tmp/forgejo-release-notes.md
          RELEASE_ID=$(curl -sf \
            -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"Veilbreak ${TAG}\",\"body\":$(jq -Rs . < /tmp/forgejo-release-notes.md)}" \
            "${FORGEJO_URL}/api/v1/repos/tux/veilbreak/releases" \
            | jq -r '.id')
          for asset in dist/*; do
            [ -f "$asset" ] || continue
            curl -sf \
              -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -F "attachment=@${asset}" \
              "${FORGEJO_URL}/api/v1/repos/tux/veilbreak/releases/${RELEASE_ID}/assets"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          printf '## Installation\n\n### Binary (any Linux)\n```bash\ntar xzf veilbreak-%s-x86_64-linux.tar.gz\nsudo cp veilbreak-%s/veilbreak-tui /usr/local/bin/\n```\n\n### Debian / Ubuntu\n```bash\nsudo dpkg -i veilbreak_*_amd64.deb\nsudo apt-get install -f\n```\n\n### From source\n```bash\ncargo install --git https://github.com/TheFlipside/veilbreak.git veilbreak-tui\n```\n' "$TAG" "$TAG" > /tmp/gh-release-notes.md
          gh release create "$TAG" \
            --repo TheFlipside/veilbreak \
            --title "Veilbreak $TAG" \
            --notes-file /tmp/gh-release-notes.md \
            -- dist/*
